name: spit_canteen
description: SPIT Campus Canteen Food Ordering App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # ── State Management ──────────────────────────────────
  provider: ^6.1.2

  # ── Image Handling ────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # ── PDF Generation ────────────────────────────────────
  pdf: ^3.10.8
  path_provider: ^2.1.3
  open_file: ^3.3.2

  # ── Date Formatting ───────────────────────────────────
  intl: ^0.19.0

  # ── Local Preferences ─────────────────────────────────
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ── Fonts ─────────────────────────────────────────────
  # Download these fonts from Google Fonts and place them in:
  #   assets/fonts/PlayfairDisplay-*.ttf
  #   assets/fonts/Lato-*.ttf
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic

  # ── Assets ────────────────────────────────────────────
  assets:
    - assets/images/placeholder_food.png
    - assets/images/logo.png
